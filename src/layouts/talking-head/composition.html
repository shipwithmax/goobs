<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Goobs — talking head</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* Look and feel: see DESIGN.md in this folder. */
  :root { --ink: #14110f; --paper: #fbf7f0; --accent: #e85d26; }
  html, body { margin: 0; background: var(--ink); }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); font-family: "Inter", sans-serif; }
  #speaker { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .callout {
    position: absolute; left: 96px; bottom: 120px; max-width: 1100px;
    padding: 36px 48px; box-sizing: border-box;
    background: var(--paper); color: var(--ink); border-left: 14px solid var(--accent);
    box-shadow: 12px 12px 0 rgba(20, 17, 15, 0.55); opacity: 0;
  }
  .callout .kicker { font-size: 28px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  .callout .body { margin-top: 10px; font-family: "Archivo Black", sans-serif; font-size: 56px; line-height: 1.1; }
  #progress { position: absolute; left: 0; bottom: 0; height: 8px; width: 0; background: var(--accent); }
</style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="1920" data-height="1080">
    <video id="speaker" class="clip" src="talking-head.mp4" muted playsinline data-start="0" data-duration="{{DURATION}}" data-track-index="1"></video>
    <audio id="voice" class="clip" src="talking-head-audio.m4a" data-start="0" data-duration="{{DURATION}}" data-track-index="10" data-volume="1"></audio>
<!--GOOBS:OVERLAYS-->
    <div id="progress"></div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const DURATION = {{DURATION}};
    const tl = gsap.timeline({ paused: true });
    tl.to("#progress", { width: "100%", duration: DURATION, ease: "none" }, 0);

    // Callouts come from director cues in 1-log/cues.json (Goobs maps them to
    // the cut timeline). Edit freely: this file is yours after `vp enrich`.
    function callout(id, inT, outT) {
      tl.fromTo(id, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, inT);
      tl.to(id, { opacity: 0, y: 12, duration: 0.4, ease: "power2.in" }, outT);
    }
/*GOOBS:TIMELINE*/
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
